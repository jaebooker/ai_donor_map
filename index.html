<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Safety Donor Map</title>
  <meta name="description" content="A map of AI safety nonprofits, projects and funds that accept donations, filterable by subfield." />
  <meta property="og:title" content="AI Safety Donor Map" />
  <meta property="og:description" content="Find AI safety nonprofits, projects and funds to donate to, by subfield and location." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230072B2'/><circle cx='16' cy='16' r='6' fill='%23E69F00'/></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>AI Safety Donor Map</h1>
      <p class="tagline">Nonprofits, projects and funds working to make advanced AI go well.</p>
    </div>
    <button id="toggle-view" class="view-toggle" type="button" aria-controls="panel">List</button>
  </header>

  <div class="layout">
    <aside id="panel" class="panel" aria-label="Organizations">
      <div class="controls">
        <label class="search">
          <span class="sr-only">Search</span>
          <input id="search" type="search" placeholder="Search name, city or keyword" autocomplete="off" />
        </label>
        <div id="chips" class="chips" role="group" aria-label="Filter by subfield"></div>
        <div class="row">
          <select id="type-filter" aria-label="Filter by type">
            <option value="">All types</option>
            <option value="Organization">Organizations</option>
            <option value="Fund">Funds</option>
            <option value="Project">Projects</option>
          </select>
          <label class="check"><input id="donate-only" type="checkbox" /> Has donate page</label>
        </div>
        <p id="count" class="count" aria-live="polite"></p>
      </div>
      <ul id="list" class="list"></ul>
      <footer class="panel-foot">
        <p>Listings are informational, not endorsements. Check each org's own site before giving. Links last checked <span id="verified"></span>.</p>
        <p><a href="https://github.com/jaebooker/ai_donor_map/issues/new?title=Suggest%20an%20org" target="_blank" rel="noopener">Suggest an org or correction</a></p>
      </footer>
    </aside>
    <main class="map-wrap">
      <div id="map" role="region" aria-label="Map of organizations"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="script.js"></script>
</body>
</html>
